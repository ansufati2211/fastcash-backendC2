spring.application.name=fastcash-c2

# ==============================================================
#  OPCIÓN A: MODO PRODUCCIÓN (RAILWAY HOBBY)
# ==============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

fastcash.security.enabled=true

# SSL OBLIGATORIO PARA RAILWAY
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.NonValidatingFactory

# ==============================================================
#  OPCIÓN B: MODO PRUEBAS LOCALES (TU PC)
# ==============================================================
#spring.datasource.url=jdbc:postgresql://localhost:5432/DvPrueba?currentSchema=cliente2
#spring.datasource.username=postgres
#spring.datasource.password=ansu22
#spring.datasource.driver-class-name=org.postgresql.Driver
#fastcash.security.enabled=false

# ==============================================================
#  CONFIGURACIONES GLOBALES Y ESQUEMAS (Específico Backend 2)
# ==============================================================
spring.datasource.hikari.connection-init-sql=SET search_path TO cliente2; SET TIME ZONE 'America/Lima';
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.properties.hibernate.default_schema=cliente2

# ==============================================================
#  OPTIMIZACIÓN EXTREMA: PLAN HOBBY RAILWAY (MENOS RAM Y CPU)
# ==============================================================
# 1. COMPRESIÓN GZIP
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# 2. HIKARICP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=2000

# 3. TOMCAT EMBEBIDO
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.max-connections=500
server.tomcat.accept-count=50

# 4. HIBERNATE & JPA
spring.jpa.properties.hibernate.default_batch_fetch_size=30
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 5. JACKSON / JSON
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# 6. SERVIDOR, ARRANQUE Y LOGS
spring.jmx.enabled=false
spring.main.lazy-initialization=true
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.level.root=WARN
# (Opcional) Cambia 'com.tu.paquete' por el paquete real de este backend para ver tus propios logs
logging.level.com.tu.paquete=INFO
server.port=${PORT:8080}
