spring.application.name=fastcash-c2

# ==============================================================
#  OPCIÓN A: MODO PRODUCCIÓN (RAILWAY HOBBY)
# ==============================================================
# La variable de Railway ya trae "jdbc:postgresql://..." así que esto es correcto
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

fastcash.security.enabled=true

# SSL OBLIGATORIO PARA RAILWAY
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.NonValidatingFactory

# ==============================================================
#  OPCIÓN B: MODO PRUEBAS LOCALES (TU PC)
# ==============================================================
#spring.datasource.url=jdbc:postgresql://localhost:5432/DvPrueba?currentSchema=cliente2
#spring.datasource.username=postgres
#spring.datasource.password=ansu22
#spring.datasource.driver-class-name=org.postgresql.Driver
#fastcash.security.enabled=false

# ==============================================================
#  CONFIGURACIONES GLOBALES Y ESQUEMAS
# ==============================================================
# Define el esquema cliente2 y la hora de Perú en la misma conexión
spring.datasource.hikari.connection-init-sql=SET search_path TO cliente2; SET TIME ZONE 'America/Lima';
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# ==============================================================
#  OPTIMIZACIÓN EXTREMA: PLAN HOBBY RAILWAY (MENOS RAM)
# ==============================================================
# 1. COMPRESIÓN GZIP
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# 2. LÍMITES HIKARI (Añadidos los timeouts para liberar conexiones inactivas)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# 3. TOMCAT EMBEBIDO (¡Faltaba esto! Reduce la RAM "Off-Heap" drásticamente)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# 4. HIBERNATE & JPA
spring.jpa.properties.hibernate.default_schema=cliente2
spring.jpa.properties.hibernate.default_batch_fetch_size=30
# Evita cargar metadatos innecesarios al arrancar
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 5. SERVIDOR Y ARRANQUE (Ahorro de memoria)
spring.jmx.enabled=false
# ¡Cambiado a TRUE! Carga los módulos solo cuando se necesitan
spring.main.lazy-initialization=true
server.port=${PORT:8080}

